name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values: only needed so $env/static/private resolves at build time,
      # no email is actually sent by `check`/`build`.
      SECRET_EMAIL_ACCOUNT: ci@example.com
      SECRET_EMAIL_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build
